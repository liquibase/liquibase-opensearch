databaseChangeLog:
  - changeSet:
      id: 1
      author: test
      preConditions:
        - onFail: MARK_RAN
        - httpCheck:
            path: /httpcheck-missing
      changes:
        - httpRequest:
            method: PUT
            path: /httpcheck-skipped-status
  - changeSet:
      id: 2
      author: test
      preConditions:
        - onFail: MARK_RAN
        - httpCheck:
            path: /
            jsonPointer: /version/distribution
            expectedValue: elasticsearch
      changes:
        - httpRequest:
            method: PUT
            path: /httpcheck-skipped-jsonpointer
